<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHBN Carton Label Generator</title>
<style>
  :root{
    --bg:#f4f1ea;
    --panel:#ffffff;
    --border:#dcd6c8;
    --text:#2b2620;
    --muted:#8a8272;
    --accent:#b5651d;
    --accent-soft:rgba(181,101,29,0.1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{margin-bottom:24px;}
  header h1{margin:0 0 4px;font-size:22px;letter-spacing:0.2px;}
  header p{margin:0;font-size:13px;color:var(--muted);}

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px;
    margin-bottom:20px;
  }
  .panel h2{margin:0 0 16px;font-size:15px;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px;font-weight:600;}
  input, textarea{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);
    background:#fbfaf6;color:var(--text);font-size:14px;font-family:inherit;
  }
  input:focus, textarea:focus{outline:none;border-color:var(--accent);}
  .field{margin-bottom:14px;}
  textarea{min-height:56px;resize:vertical;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 20px;border-radius:8px;border:none;cursor:pointer;
    font-size:14px;font-weight:600;font-family:inherit;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-row{display:flex;gap:10px;margin-top:6px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}

  .hint{font-size:12px;color:var(--muted);margin-top:4px;}
  .error{font-size:12.5px;color:#b3261e;margin-top:8px;}

  /* ---------- Label preview (also used for print) ---------- */
  #labelsWrap{display:none;}
  #labelsWrap.visible{display:block;}

  .page-group{
    break-after:page;
    page-break-after:always;
  }
  .page-group:last-child{
    break-after:auto;
    page-break-after:auto;
  }

  .label{
    display:grid;
    grid-template-columns:16% 31.5% 11.8% 23.6% 17.1%;
    grid-auto-rows:26px;
    border:2px solid #000;
    margin-bottom:10px;
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    page-break-inside:avoid;
    break-inside:avoid;
  }
  .label .cell{
    border:1px solid #000;
    display:flex;
    align-items:center;
    padding:0 6px;
    font-size:11.5px;
    font-weight:700;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .label .company{
    grid-column:1 / 5;
    justify-content:center;
    text-align:center;
    font-size:13px;
  }
  .label .ctn{
    grid-column:5;
    grid-row:1 / 7;
    justify-content:center;
    text-align:center;
    white-space:pre-line;
    line-height:1.25;
    font-size:12px;
  }
  .label .lbl{ justify-content:flex-start; }
  .label .val{ justify-content:center; text-align:center; }
  .label .val.left{ justify-content:flex-start; text-align:left; }

  .preview-note{font-size:12.5px;color:var(--muted);margin-bottom:14px;}

  @media print{
    body{background:#fff;padding:0;margin:0;}
    .no-print{display:none !important;}
    .wrap{max-width:none;padding:0;margin:0;}
    #labelsWrap{display:block !important;}
    @page{margin:12mm;}
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="no-print">
    <h1>SHBN Carton Label Generator</h1>
    <p>Fill in shipment details, generate carton labels, then print.</p>
  </header>

  <div class="panel no-print">
    <h2>Shipment Details</h2>

    <div class="grid2">
      <div class="field">
        <label>From</label>
        <input type="text" id="f_from" placeholder="e.g. SHBN" value="SHBN">
      </div>
      <div class="field">
        <label>To</label>
        <input type="text" id="f_to" placeholder="e.g. SHPL">
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label>ODO / PO</label>
        <input type="text" id="f_odo" placeholder="e.g. 8000228923">
      </div>
      <div class="field">
        <label>Dept</label>
        <input type="text" id="f_dept" placeholder="e.g. BEVERAGE">
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label>Date</label>
        <input type="date" id="f_date">
      </div>
      <div class="field">
        <label>Total Carton</label>
        <input type="number" id="f_total" min="1" step="1" placeholder="e.g. 10">
      </div>
    </div>

    <div class="field">
      <label>Remark</label>
      <textarea id="f_remark" placeholder="Optional remark"></textarea>
    </div>

    <div id="formError" class="error"></div>

    <div class="btn-row">
      <button class="btn btn-ghost" id="clearBtn" type="button">Clear</button>
      <button class="btn btn-primary" id="generateBtn" type="button">Generate Labels</button>
    </div>
  </div>

  <div class="panel no-print" id="printPanel" style="display:none;">
    <h2>Preview</h2>
    <p class="preview-note" id="previewNote"></p>
    <div class="btn-row">
      <button class="btn btn-ghost" id="editBtn" type="button">&larr; Edit Details</button>
      <button class="btn btn-primary" id="printBtn" type="button">🖨 Print</button>
    </div>
  </div>

  <div id="labelsWrap"></div>

</div>

<script>
  function pad2(n){ return String(n).padStart(2,'0'); }

  function formatDateDisplay(isoDate){
    if(!isoDate) return '';
    var parts = isoDate.split('-'); // yyyy-mm-dd
    return pad2(parts[2]) + '.' + pad2(parts[1]) + '.' + parts[0];
  }

  function escapeHtml(str){
    if(str === undefined || str === null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  var LABELS_PER_PAGE = 5;

  function buildLabel(data, index, total){
    var ctnText = 'CTN\n' + index + '/' + total;
    return (
      '<div class="label">' +
        '<div class="cell company">SERVAY EVERGREEN SDN BHD (SHBN)</div>' +
        '<div class="cell ctn">' + escapeHtml(ctnText) + '</div>' +

        '<div class="cell lbl">FROM</div>' +
        '<div class="cell val" style="grid-column:2 / 5;">' + escapeHtml(data.from) + '</div>' +

        '<div class="cell lbl">TO</div>' +
        '<div class="cell val" style="grid-column:2 / 5;">' + escapeHtml(data.to) + '</div>' +

        '<div class="cell lbl">ODO/PO</div>' +
        '<div class="cell val" style="grid-column:2 / 5;">' + escapeHtml(data.odo) + '</div>' +

        '<div class="cell lbl">DEPT</div>' +
        '<div class="cell val">' + escapeHtml(data.dept) + '</div>' +
        '<div class="cell lbl">DATE</div>' +
        '<div class="cell val left">' + escapeHtml(data.dateDisplay) + '</div>' +

        '<div class="cell lbl">REMARK</div>' +
        '<div class="cell val" style="grid-column:2 / 5;">' + escapeHtml(data.remark) + '</div>' +
      '</div>'
    );
  }

  document.getElementById('generateBtn').addEventListener('click', function(){
    var errEl = document.getElementById('formError');
    errEl.textContent = '';

    var data = {
      from: document.getElementById('f_from').value.trim(),
      to: document.getElementById('f_to').value.trim(),
      odo: document.getElementById('f_odo').value.trim(),
      dept: document.getElementById('f_dept').value.trim(),
      remark: document.getElementById('f_remark').value.trim()
    };
    var dateRaw = document.getElementById('f_date').value;
    var total = parseInt(document.getElementById('f_total').value, 10);

    if(!data.from || !data.to || !data.odo || !data.dept){
      errEl.textContent = 'Please fill in From, To, ODO/PO, and Dept.';
      return;
    }
    if(!dateRaw){
      errEl.textContent = 'Please select a date.';
      return;
    }
    if(!total || total < 1){
      errEl.textContent = 'Please enter a valid Total Carton (1 or more).';
      return;
    }
    if(total > 300){
      errEl.textContent = 'That\'s a lot of cartons (' + total + ') - please confirm this is correct before generating.';
      return;
    }

    data.dateDisplay = formatDateDisplay(dateRaw);

    var html = '';
    for(var i = 1; i <= total; i++){
      if((i - 1) % LABELS_PER_PAGE === 0){
        if(i !== 1) html += '</div>'; // close previous page-group
        html += '<div class="page-group">';
      }
      html += buildLabel(data, i, total);
    }
    html += '</div>'; // close final page-group
    document.getElementById('labelsWrap').innerHTML = html;
    document.getElementById('labelsWrap').classList.add('visible');

    var pageCount = Math.ceil(total / LABELS_PER_PAGE);
    document.getElementById('previewNote').textContent =
      total + ' label' + (total === 1 ? '' : 's') + ' generated across ' + pageCount + ' page' + (pageCount === 1 ? '' : 's') +
      ' (' + LABELS_PER_PAGE + ' per page) - CTN 1/' + total + ' through CTN ' + total + '/' + total + '.';

    document.getElementById('printPanel').style.display = 'block';
    document.querySelector('.panel').scrollIntoView({ behavior: 'smooth' });
  });

  document.getElementById('clearBtn').addEventListener('click', function(){
    ['f_from','f_to','f_odo','f_dept','f_remark','f_date','f_total'].forEach(function(id){
      document.getElementById(id).value = '';
    });
    document.getElementById('f_from').value = 'SHBN';
    document.getElementById('formError').textContent = '';
    document.getElementById('printPanel').style.display = 'none';
    document.getElementById('labelsWrap').classList.remove('visible');
    document.getElementById('labelsWrap').innerHTML = '';
  });

  document.getElementById('editBtn').addEventListener('click', function(){
    document.getElementById('printPanel').style.display = 'none';
    document.getElementById('labelsWrap').classList.remove('visible');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.getElementById('printBtn').addEventListener('click', function(){
    window.print();
  });
</script>

</body>
</html>
